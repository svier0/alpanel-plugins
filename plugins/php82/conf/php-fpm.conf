[global]
pid = /www/server/php/__VER__/var/run/php-fpm.pid
error_log = /www/server/php/__VER__/var/log/php-fpm.log
log_level = notice

[www]
listen = /tmp/php-cgi-__VER__.sock
listen.backlog = 8192
listen.allowed_clients = 127.0.0.1
listen.owner = www
listen.group = www
listen.mode = 0600
user = www
group = www
pm = ondemand
pm.status_path = /phpfpm___VER___status
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 5
pm.max_spare_servers = 10
request_terminate_timeout = 100
request_slowlog_timeout = 30
slowlog = /www/server/php/__VER__/var/log/slow.log